<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>莫比乌斯环实验室</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: "SF Pro Display", "PingFang SC", system-ui, sans-serif;
      background: #0a0e18;
      color: #c8d4e8;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    canvas { display: block; }

    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: min(280px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      padding: 18px 16px;
      border-radius: 14px;
      background: rgba(18, 24, 38, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(80, 120, 180, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    #panel h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #6eb6ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #panel .subtitle {
      font-size: 0.7rem;
      color: rgba(140, 160, 190, 0.75);
      margin-bottom: 16px;
    }
    .section {
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(80, 110, 160, 0.2);
    }
    .section:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .section-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: #8ab4f0;
      margin-bottom: 10px;
    }
    .control {
      margin-bottom: 10px;
    }
    .control label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.75rem;
      color: rgba(180, 200, 230, 0.9);
      margin-bottom: 6px;
    }
    .control label span.val {
      font-variant-numeric: tabular-nums;
      color: #ff9a4a;
      font-size: 0.72rem;
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(80, 120, 180, 0.35);
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9a4a, #ff6b35);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 120, 50, 0.6);
    }
    .row-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    button {
      flex: 1;
      min-width: 72px;
      padding: 8px 10px;
      font-size: 0.72rem;
      border: 1px solid rgba(100, 140, 200, 0.3);
      border-radius: 8px;
      background: rgba(40, 55, 85, 0.9);
      color: #b8cce8;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover {
      background: rgba(55, 75, 110, 1);
      border-color: rgba(120, 170, 230, 0.5);
    }
    button.active {
      background: rgba(255, 140, 60, 0.22);
      border-color: #ff8c3a;
      color: #ffc090;
    }
    button.btn-primary {
      background: linear-gradient(135deg, rgba(255, 140, 60, 0.35), rgba(255, 90, 40, 0.25));
      border-color: rgba(255, 140, 60, 0.55);
      color: #ffd0a8;
    }
    .mode-btns {
      display: flex;
      gap: 6px;
    }
    .mode-btns button {
      flex: 1;
      min-width: 0;
      padding: 7px 4px;
      font-size: 0.68rem;
    }
    .cut-btns {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .cut-btns button {
      min-width: 0;
      padding: 7px 2px;
      font-size: 0.62rem;
    }
    button.btn-cut.active {
      background: rgba(80, 200, 120, 0.28);
      border-color: #5cd68a;
      color: #b8f0c8;
    }
    .hint-text {
      font-size: 0.65rem;
      color: rgba(140, 160, 190, 0.65);
      line-height: 1.45;
      margin-top: 8px;
    }
    #status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.68rem;
      line-height: 1.4;
      background: rgba(40, 80, 50, 0.35);
      border: 1px solid rgba(80, 180, 100, 0.35);
      color: #8fd4a0;
    }
    #status.pending {
      background: rgba(60, 55, 30, 0.35);
      border-color: rgba(200, 160, 60, 0.35);
      color: #e8c878;
    }

    @media (max-width: 480px) {
      #panel {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-height: 52vh;
        border-radius: 16px 16px 0 0;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <aside id="panel">
    <h1>莫比乌斯环实验室</h1>
    <p class="subtitle">带宽裁剪 · 边界描边</p>

    <div class="section">
      <div class="section-title">选择模式</div>
      <div class="cut-btns" id="cut-btns">
        <button type="button" data-segments="1" class="btn-cut active">原状</button>
        <button type="button" data-segments="2" class="btn-cut">二等分</button>
        <button type="button" data-segments="3" class="btn-cut">三等分</button>
        <button type="button" data-segments="4" class="btn-cut">四等分</button>
        <button type="button" data-segments="5" class="btn-cut">五等分</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">神奇剪刀 · 裁剪进度</div>
      <div class="control">
        <label>沿环裁剪 <span class="val" id="val-cut">0%</span></label>
        <input type="range" id="cut" min="0" max="1" step="0.005" value="0" />
      </div>
      <div class="row-btns">
        <button type="button" id="btn-auto-cut" class="btn-primary">自动裁剪</button>
        <button type="button" id="btn-reset-cut">重置</button>
      </div>
      <div class="control" style="margin-top:12px">
        <label>拉开它们 <span class="val" id="val-spread">0.0</span></label>
        <input type="range" id="spread" min="0" max="8" step="0.1" value="0" />
      </div>
      <p class="hint-text">沿带宽均分剪开后，拖动拉开滑块，看各条带如何在空间中分离。</p>
    </div>

    <div class="section">
      <div class="section-title">描边进度</div>
      <div class="control">
        <label>已描长度 <span class="val" id="val-trace">0%</span></label>
        <input type="range" id="trace" min="0" max="1" step="0.005" value="0" />
      </div>
      <div class="row-btns">
        <button type="button" id="btn-auto-trace" class="btn-primary">自动描边</button>
        <button type="button" id="btn-reset-trace">重置</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">显示模式</div>
      <div class="mode-btns">
        <button type="button" data-mode="both" class="active">环+边界</button>
        <button type="button" data-mode="boundary">仅边界</button>
        <button type="button" data-mode="ring">仅环</button>
      </div>
    </div>

    <div id="status" class="pending">状态：拖动滑块开始描边</div>
  </aside>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const U_SEG = 256;
    const V_SEG = 24;
    const BOUNDARY_SEG = 512;

    const params = {
      R: 2,
      w: 0.6,
      segments: 1,
      cutProgress: 0,
      spread: 0,
      traceProgress: 0,
      displayMode: "both",
      autoTracing: false,
      autoCutting: false,
    };

    let mobiusStrips = [];
    let stripMaterials = [];
    let divisionLines = [];
    let spreadCurrent = 0;
    let spreadTarget = 0;
    let lastRebuildSpread = -1;

    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060a12);
    scene.fog = new THREE.FogExp2(0x060a12, 0.028);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(4.8, 2.8, 5.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 2.5;
    controls.maxDistance = 36;

    const ambient = new THREE.AmbientLight(0x304060, 0.5);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(6, 8, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x6080c0, 0.6);
    fillLight.position.set(-5, 2, -4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffe8c0, 0.85);
    rimLight.position.set(0, 3, -6);
    scene.add(rimLight);

    const grid = new THREE.GridHelper(14, 28, 0x1a2840, 0x121c2e);
    grid.position.y = -2.8;
    scene.add(grid);

    const starGeo = new THREE.BufferGeometry();
    const starCount = 400;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const r = 8 + Math.random() * 22;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.4;
      starPos[i * 3 + 2] = r * Math.cos(phi);
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({ color: 0x8899bb, size: 0.04, transparent: true, opacity: 0.7 })
    );
    scene.add(stars);

    const mobiusGroup = new THREE.Group();
    scene.add(mobiusGroup);

    let boundaryGroup = new THREE.Group();
    mobiusGroup.add(boundaryGroup);

    function mobiusPoint(R, w, u, v) {
      const cu = Math.cos(u);
      const su = Math.sin(u);
      const ch = Math.cos(u / 2);
      const sh = Math.sin(u / 2);
      const scale = R + v * ch;
      return new THREE.Vector3(scale * cu, scale * su, v * sh);
    }

    /** 沿商空间边界：v=+w/2 的 u:0→2π，再 v=-w/2 的 u:0→2π */
    function mobiusBoundaryPoint(R, w, t) {
      const halfW = w / 2;
      const uFull = Math.PI * 2;
      const s = Math.min(Math.max(t, 0), 1);
      if (s >= 1) return mobiusPoint(R, w, uFull, -halfW);
      const local = s * 2;
      if (local <= 1) return mobiusPoint(R, w, local * uFull, halfW);
      return mobiusPoint(R, w, (local - 1) * uFull, -halfW);
    }

    function buildArcLengthTable(points) {
      const lengths = [0];
      for (let i = 1; i < points.length; i++) {
        lengths.push(lengths[i - 1] + points[i].distanceTo(points[i - 1]));
      }
      return lengths;
    }

    function resampleByArcLength(points, targetCount) {
      if (points.length < 2) return points.slice();
      const lengths = buildArcLengthTable(points);
      const total = lengths[lengths.length - 1];
      if (total < 1e-8) return [points[0].clone()];

      const out = [];
      for (let j = 0; j <= targetCount; j++) {
        const target = (j / targetCount) * total;
        let i = 1;
        while (i < lengths.length && lengths[i] < target) i++;
        if (i >= points.length) {
          out.push(points[points.length - 1].clone());
          continue;
        }
        const segStart = lengths[i - 1];
        const segLen = lengths[i] - segStart;
        const alpha = segLen > 1e-8 ? (target - segStart) / segLen : 0;
        out.push(new THREE.Vector3().lerpVectors(points[i - 1], points[i], alpha));
      }
      return out;
    }

    function pointAtArcLength(points, lengths, dist) {
      const total = lengths[lengths.length - 1];
      const target = Math.min(Math.max(dist, 0), total);
      let i = 1;
      while (i < lengths.length && lengths[i] < target) i++;
      if (i >= points.length) return points[points.length - 1].clone();
      const segStart = lengths[i - 1];
      const segLen = lengths[i] - segStart;
      const alpha = segLen > 1e-8 ? (target - segStart) / segLen : 0;
      return new THREE.Vector3().lerpVectors(points[i - 1], points[i], alpha);
    }

    function slicePathByArcLength(points, lengths, progress) {
      const total = lengths[lengths.length - 1];
      const target = total * Math.min(Math.max(progress, 0), 1);
      const out = [points[0].clone()];
      for (let i = 1; i < points.length; i++) {
        if (lengths[i] <= target + 1e-9) {
          out.push(points[i].clone());
        } else {
          out.push(pointAtArcLength(points, lengths, target));
          break;
        }
      }
      return out;
    }

    const boundaryPathCache = { valid: false, points: null, lengths: null };

    function getBoundaryPath(R, w) {
      if (boundaryPathCache.valid && boundaryPathCache.points) {
        return boundaryPathCache;
      }
      const dense = BOUNDARY_SEG * 3;
      const raw = [];
      for (let i = 0; i <= dense; i++) {
        raw.push(mobiusBoundaryPoint(R, w, i / dense));
      }
      const points = resampleByArcLength(raw, BOUNDARY_SEG);
      const lengths = buildArcLengthTable(points);
      boundaryPathCache.valid = true;
      boundaryPathCache.points = points;
      boundaryPathCache.lengths = lengths;
      return boundaryPathCache;
    }

    function invalidateBoundaryCache() {
      boundaryPathCache.valid = false;
      boundaryPathCache.points = null;
      boundaryPathCache.lengths = null;
    }

    function gapRatioForSegments(segCount) {
      if (segCount <= 1) return 0;
      return 0.045 + (segCount - 1) * 0.012;
    }

    function segmentVRange(segCount, segIndex, w) {
      const halfW = w / 2;
      if (segCount <= 1) return { vMin: -halfW, vMax: halfW };
      const gap = w * gapRatioForSegments(segCount);
      const stripW = (w - segCount * gap) / segCount;
      const vMin = -halfW + segIndex * (stripW + gap);
      return { vMin, vMax: vMin + stripW };
    }

    function stripSpreadIndex(segIndex, segCount) {
      return segIndex - (segCount - 1) * 0.5;
    }

    function mobiusBitangent(R, w, u, v) {
      const p = mobiusPoint(R, w, u, v);
      const pV = mobiusPoint(R, w, u, v + 1e-4);
      return new THREE.Vector3().subVectors(pV, p).normalize();
    }

    function stripPoint(R, w, u, v, segIndex, segCount, spread) {
      const p = mobiusPoint(R, w, u, v);
      if (spread <= 0 || segCount <= 1) return p;
      const idx = stripSpreadIndex(segIndex, segCount);
      return p.addScaledVector(mobiusBitangent(R, w, u, v), spread * idx);
    }

    function buildStripGeometry(
      R, w, vMin, vMax, segIndex, segCount, spread, cutProgress
    ) {
      const uFull = Math.PI * 2;
      const uMax = Math.max(0.002, cutProgress) * uFull;
      const uSeg = Math.max(4, Math.floor(U_SEG * cutProgress));
      const vSpan = vMax - vMin;
      const vSeg = Math.max(3, Math.floor(V_SEG * (vSpan / w)));
      const positions = [];
      const normals = [];
      const indices = [];
      const eps = 1e-4;

      for (let i = 0; i <= uSeg; i++) {
        const u = (i / uSeg) * uMax;
        for (let j = 0; j <= vSeg; j++) {
          const v = vMin + (j / vSeg) * vSpan;
          const p = stripPoint(R, w, u, v, segIndex, segCount, spread);
          positions.push(p.x, p.y, p.z);

          const pU = stripPoint(R, w, u + eps, v, segIndex, segCount, spread);
          const pV = stripPoint(R, w, u, v + eps, segIndex, segCount, spread);
          const tu = new THREE.Vector3().subVectors(pU, p);
          const tv = new THREE.Vector3().subVectors(pV, p);
          const n = new THREE.Vector3().crossVectors(tu, tv).normalize();
          normals.push(n.x, n.y, n.z);
        }
      }

      for (let i = 0; i < uSeg; i++) {
        for (let j = 0; j < vSeg; j++) {
          const a = i * (vSeg + 1) + j;
          const b = a + vSeg + 1;
          indices.push(a, b, a + 1);
          indices.push(b, b + 1, a + 1);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
      geo.setIndex(indices);
      geo.computeBoundingSphere();
      return geo;
    }

    function stripHue(segIndex, segCount) {
      if (segCount <= 1) return 42;
      return (segIndex / segCount) * 360;
    }

    function makeStripMaterial(segIndex, segCount) {
      const c = new THREE.Color();
      c.setHSL(stripHue(segIndex, segCount) / 360, 0.78, 0.52);
      return new THREE.MeshStandardMaterial({
        color: c,
        emissive: c.clone().multiplyScalar(0.14),
        metalness: 0.58,
        roughness: 0.32,
        side: THREE.DoubleSide,
      });
    }

    function recalcSpreadTarget() {
      const n = Math.round(params.segments);
      spreadTarget = n <= 1 ? 0 : params.spread;
    }

    function divisionVPositions(segCount, w) {
      if (segCount <= 1) return [];
      const halfW = w / 2;
      const gap = w * gapRatioForSegments(segCount);
      const stripW = (w - segCount * gap) / segCount;
      const positions = [];
      for (let k = 0; k < segCount - 1; k++) {
        const vMin = -halfW + k * (stripW + gap);
        positions.push(vMin + stripW + gap * 0.5);
      }
      return positions;
    }

    function disposeDivisionLines() {
      divisionLines.forEach((obj) => {
        obj.traverse((child) => {
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        });
        mobiusGroup.remove(obj);
      });
      divisionLines = [];
    }

    function buildDivisionLine(R, w, vLine, cutProgress) {
      const uFull = Math.PI * 2;
      const uMax = Math.max(0.002, cutProgress) * uFull;
      const uSeg = Math.max(32, Math.floor(U_SEG * cutProgress));
      const points = [];
      for (let i = 0; i <= uSeg; i++) {
        const u = (i / uSeg) * uMax;
        points.push(mobiusPoint(R, w, u, vLine));
      }
      if (points.length < 2) return null;

      const curve = polylineCurve(points);
      const tubularSegments = Math.max(points.length - 1, 8);
      const coreGeo = new THREE.TubeGeometry(curve, tubularSegments, 0.014, 6, false);
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        toneMapped: false,
      });
      const core = new THREE.Mesh(coreGeo, coreMat);
      core.renderOrder = 4;

      const glowGeo = new THREE.TubeGeometry(curve, tubularSegments, 0.028, 6, false);
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.28,
        depthWrite: false,
        toneMapped: false,
      });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.renderOrder = 3;

      const group = new THREE.Group();
      group.add(glow);
      group.add(core);
      return group;
    }

    function updateDivisionLines() {
      disposeDivisionLines();
      const { R, w, segments } = params;
      const n = Math.round(segments);
      if (n <= 1) return;

      const cut = effectiveCutProgress();
      const lineProgress = cut > 0 ? cut : 1;
      const vLines = divisionVPositions(n, w);
      for (const vLine of vLines) {
        const line = buildDivisionLine(R, w, vLine, lineProgress);
        if (line) {
          mobiusGroup.add(line);
          divisionLines.push(line);
        }
      }
    }

    function disposeMobiusStrips() {
      mobiusStrips.forEach((mesh) => {
        mesh.geometry.dispose();
        mobiusGroup.remove(mesh);
      });
      mobiusStrips = [];
      stripMaterials.forEach((m) => m.dispose());
      stripMaterials = [];
    }

    function disposeBoundary() {
      while (boundaryGroup.children.length) {
        const child = boundaryGroup.children[0];
        boundaryGroup.remove(child);
        child.traverse((obj) => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            mats.forEach((m) => m.dispose());
          }
        });
      }
    }

    function polylineCurve(points) {
      const path = new THREE.CurvePath();
      for (let i = 0; i < points.length - 1; i++) {
        path.add(new THREE.LineCurve3(points[i], points[i + 1]));
      }
      return path;
    }

    function buildBoundaryTube(points, lengths, progress) {
      const slice = slicePathByArcLength(points, lengths, progress);
      if (slice.length < 2) return null;

      const curve = polylineCurve(slice);
      const tubularSegments = Math.max(slice.length - 1, 4);
      const geo = new THREE.TubeGeometry(curve, tubularSegments, 0.028, 8, false);
      const mat = new THREE.MeshBasicMaterial({
        color: 0xff7722,
        transparent: true,
        opacity: 0.95,
        toneMapped: false,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = 2;

      const glowGeo = new THREE.TubeGeometry(curve, tubularSegments, 0.055, 8, false);
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0xff5500,
        transparent: true,
        opacity: 0.22,
        depthWrite: false,
        toneMapped: false,
      });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.renderOrder = 1;

      const group = new THREE.Group();
      group.add(glow);
      group.add(mesh);
      return group;
    }

    function updateBoundaries() {
      disposeBoundary();
      const { R, w, traceProgress } = params;
      const { points, lengths } = getBoundaryPath(R, w);

      if (traceProgress > 0) {
        const tube = buildBoundaryTube(points, lengths, traceProgress);
        if (tube) boundaryGroup.add(tube);
      }
    }

    function effectiveCutProgress() {
      const n = Math.round(params.segments);
      if (n <= 1) return 1;
      return params.cutProgress;
    }

    function updateMobiusStrips() {
      disposeMobiusStrips();
      const { R, w, segments } = params;
      const n = Math.round(segments);
      const cut = effectiveCutProgress();
      updateDivisionLines();
      if (cut <= 0) {
        if (n > 1) {
          const halfW = w / 2;
          const geo = buildStripGeometry(
            R, w, -halfW, halfW, 0, 1, spreadCurrent, 1
          );
          const mat = makeStripMaterial(0, n);
          stripMaterials.push(mat);
          const mesh = new THREE.Mesh(geo, mat);
          mobiusGroup.add(mesh);
          mobiusStrips.push(mesh);
        }
        applyDisplayMode();
        return;
      }

      for (let k = 0; k < n; k++) {
        const { vMin, vMax } = segmentVRange(n, k, w);
        const geo = buildStripGeometry(
          R, w, vMin, vMax, k, n, spreadCurrent, cut
        );
        const mat = makeStripMaterial(k, n);
        stripMaterials.push(mat);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = false;
        mobiusGroup.add(mesh);
        mobiusStrips.push(mesh);
      }
      lastRebuildSpread = spreadCurrent;
      applyDisplayMode();
    }

    function applyDisplayMode() {
      const mode = params.displayMode;
      const showRing = mode !== "boundary";
      mobiusStrips.forEach((m) => {
        m.visible = showRing;
      });
      divisionLines.forEach((line) => {
        line.visible = showRing;
      });
      boundaryGroup.visible = mode !== "ring";
    }

    function updateStatus() {
      const el = document.getElementById("status");
      const cut = params.cutProgress;
      const n = Math.round(params.segments);
      if (n > 1 && cut < 1) {
        el.className = "pending";
        el.textContent = `状态：裁剪中… ${Math.round(cut * 100)}%（${n} 条带）`;
      } else if (n > 1 && cut >= 1 && params.spread > 0) {
        el.className = "";
        el.textContent = "✓ 裁剪完成！拖动「拉开它们」观察各环分离";
      } else if (n > 1 && cut >= 1) {
        el.className = "";
        el.textContent = "✓ 裁剪完成！可拉开各条带或继续描边";
      } else if (params.traceProgress >= 1) {
        el.className = "";
        el.textContent = "✓ 描边完成！可切换模式查看";
      } else if (params.traceProgress > 0) {
        el.className = "pending";
        el.textContent = `状态：描边中… ${Math.round(params.traceProgress * 100)}%`;
      } else {
        el.className = "pending";
        el.textContent = "状态：选择等分模式，开始裁剪";
      }
    }

    function refresh(force = true) {
      const spreadChanged =
        force || Math.abs(spreadCurrent - lastRebuildSpread) > 0.004;
      if (spreadChanged) {
        updateMobiusStrips();
      }
    }

    function refreshAll() {
      recalcSpreadTarget();
      invalidateBoundaryCache();
      updateMobiusStrips();
      updateBoundaries();
      updateStatus();
    }

    recalcSpreadTarget();
    refreshAll();

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (params.autoTracing && params.traceProgress < 1) {
        params.traceProgress = Math.min(1, params.traceProgress + dt * 0.28);
        document.getElementById("trace").value = params.traceProgress;
        document.getElementById("val-trace").textContent =
          Math.round(params.traceProgress * 100) + "%";
        updateBoundaries();
        updateStatus();
        if (params.traceProgress >= 1) {
          params.autoTracing = false;
          document.getElementById("btn-auto-trace").classList.remove("active");
        }
      }

      if (params.autoCutting && params.cutProgress < 1) {
        params.cutProgress = Math.min(1, params.cutProgress + dt * 0.32);
        document.getElementById("cut").value = params.cutProgress;
        document.getElementById("val-cut").textContent =
          Math.round(params.cutProgress * 100) + "%";
        updateMobiusStrips();
        updateStatus();
        if (params.cutProgress >= 1) {
          params.autoCutting = false;
          document.getElementById("btn-auto-cut").classList.remove("active");
        }
      }

      if (Math.abs(spreadTarget - spreadCurrent) > 0.001) {
        spreadCurrent += (spreadTarget - spreadCurrent) * Math.min(1, dt * 6);
        updateMobiusStrips();
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    const traceEl = document.getElementById("trace");
    const cutEl = document.getElementById("cut");
    const spreadEl = document.getElementById("spread");

    function setSegments(n) {
      params.segments = n;
      document.querySelectorAll("#cut-btns .btn-cut").forEach((btn) => {
        btn.classList.toggle("active", parseInt(btn.dataset.segments, 10) === n);
      });
      if (n <= 1) {
        params.cutProgress = 0;
        cutEl.value = 0;
        document.getElementById("val-cut").textContent = "0%";
        params.spread = 0;
        spreadEl.value = 0;
        document.getElementById("val-spread").textContent = "0.0";
        spreadCurrent = 0;
        spreadTarget = 0;
        params.autoCutting = false;
        document.getElementById("btn-auto-cut").classList.remove("active");
      } else if (params.cutProgress < 1) {
        params.autoCutting = true;
        document.getElementById("btn-auto-cut").classList.add("active");
      }
      recalcSpreadTarget();
      refreshAll();
    }

    document.querySelectorAll("#cut-btns .btn-cut").forEach((btn) => {
      btn.addEventListener("click", () => {
        setSegments(parseInt(btn.dataset.segments, 10));
      });
    });

    cutEl.addEventListener("input", () => {
      params.cutProgress = parseFloat(cutEl.value);
      params.autoCutting = false;
      document.getElementById("btn-auto-cut").classList.remove("active");
      document.getElementById("val-cut").textContent =
        Math.round(params.cutProgress * 100) + "%";
      updateMobiusStrips();
      updateStatus();
    });

    spreadEl.addEventListener("input", () => {
      params.spread = parseFloat(spreadEl.value);
      document.getElementById("val-spread").textContent = params.spread.toFixed(1);
      recalcSpreadTarget();
    });

    document.getElementById("btn-auto-cut").addEventListener("click", function () {
      if (params.segments <= 1) {
        setSegments(2);
      }
      params.autoCutting = !params.autoCutting;
      this.classList.toggle("active", params.autoCutting);
      if (params.autoCutting && params.cutProgress >= 1) {
        params.cutProgress = 0;
        cutEl.value = 0;
        document.getElementById("val-cut").textContent = "0%";
        updateMobiusStrips();
        updateStatus();
      }
    });

    document.getElementById("btn-reset-cut").addEventListener("click", () => {
      params.autoCutting = false;
      params.cutProgress = 0;
      params.spread = 0;
      spreadCurrent = 0;
      spreadTarget = 0;
      cutEl.value = 0;
      spreadEl.value = 0;
      document.getElementById("btn-auto-cut").classList.remove("active");
      document.getElementById("val-cut").textContent = "0%";
      document.getElementById("val-spread").textContent = "0.0";
      refreshAll();
    });

    traceEl.addEventListener("input", () => {
      params.traceProgress = parseFloat(traceEl.value);
      params.autoTracing = false;
      document.getElementById("btn-auto-trace").classList.remove("active");
      document.getElementById("val-trace").textContent =
        Math.round(params.traceProgress * 100) + "%";
      updateBoundaries();
      updateStatus();
    });

    document.getElementById("btn-auto-trace").addEventListener("click", function () {
      params.autoTracing = !params.autoTracing;
      this.classList.toggle("active", params.autoTracing);
      if (params.autoTracing && params.traceProgress >= 1) {
        params.traceProgress = 0;
        traceEl.value = 0;
        document.getElementById("val-trace").textContent = "0%";
        updateBoundaries();
        updateStatus();
      }
    });

    document.getElementById("btn-reset-trace").addEventListener("click", () => {
      params.autoTracing = false;
      params.traceProgress = 0;
      traceEl.value = 0;
      document.getElementById("btn-auto-trace").classList.remove("active");
      document.getElementById("val-trace").textContent = "0%";
      updateBoundaries();
      updateStatus();
    });

    document.querySelectorAll(".mode-btns button").forEach((btn) => {
      btn.addEventListener("click", () => {
        params.displayMode = btn.dataset.mode;
        document.querySelectorAll(".mode-btns button").forEach((b) => {
          b.classList.toggle("active", b === btn);
        });
        applyDisplayMode();
      });
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
